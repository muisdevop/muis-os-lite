# Local / single-server stack: the MUIS OS Lite API + web UI and a Qdrant vector DB.
#   cp .env.example .env   # add NEBIUS_API_KEY and TAVILY_API_KEY
#   docker compose up -d --build   ->  http://localhost:8000
# For a public HTTPS deployment use scripts/deploy.sh (adds Caddy via docker-compose.prod.yml).
services:
  api:
    build: .
    image: muis-os-lite:latest
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      SKILLS_DIR: /data/skills
    volumes:
      - muis_data:/data          # SQLite chats + briefs, learned skills
    ports:
      - "127.0.0.1:8000:8000"    # localhost only; Caddy or an SSH tunnel publishes it
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage   # long-term memory vectors
    restart: unless-stopped           # not published: only the api container can reach it

volumes:
  muis_data:
  qdrant_data:
