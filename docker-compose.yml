services:
  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      SKILLS_DIR: /data/skills
    volumes:
      - skills_data:/data/skills
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
  skills_data:
